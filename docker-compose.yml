version: "3.9"

services:
  pptgen:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - DATABASE_URL=sqlite:////app/instance/pptgen.db
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=changeme123
      # - ADMIN_API_KEY=change_me
    volumes:
      - ./instance:/app/instance
